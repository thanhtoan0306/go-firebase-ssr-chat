{{template "layout.html" .}}

{{define "title"}}Chat{{end}}

{{define "body"}}
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brandicon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M13.2 2.3c.2 2.1-.5 3.6-1.7 4.9-1.2 1.3-2.7 2.4-3.6 3.9-.9 1.5-1 3.3-.1 4.7.8 1.2 2.1 1.8 3.5 1.8 2.7 0 5-2.1 5-4.9 0-1.6-.7-2.9-1.6-4.1-.6-.8-1.3-1.6-1.6-2.6 1.9.9 3.6 2.6 4.5 4.7.9 2 .9 4.4-.1 6.5-1.1 2.3-3.5 3.8-6 4-2.8.2-5.6-1.1-7.1-3.5-1.3-2.1-1.4-4.9-.4-7.2 1.3-3 4.3-4.8 6.5-8.8.4-.7.7-1.5.7-2.4Z"/>
        </svg>
      </div>
    </div>
    <div class="toptools">
      <button class="iconbtn" type="button" id="openQr" aria-label="Show QR code">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm10 0h2v2h-2v-2Zm-2-2h4v4h-4v-4Zm6 0h2v6h-6v-2h4v-4Zm0 8h2v2h-2v-2Zm-4 0h2v2h-2v-2Zm0-4h2v2h-2v-2Z"/>
        </svg>
      </button>
      <input
        class="search"
        id="search"
        name="search"
        type="search"
        placeholder="Search messages…"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="clearsearch" type="button" id="clearSearch" aria-label="Clear search">Clear</button>
    </div>
  </header>

  <main class="card">
    <section class="messages" id="messages"
      hx-get="/messages"
      hx-trigger="every 8s"
      hx-swap="innerHTML">
      {{template "messages.html" .}}
    </section>

    <form class="composer"
      hx-post="/send"
      hx-target="#messages"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful){window.__chatForceScroll=true; const ta=this.querySelector('textarea[name=text]'); if(ta){ta.value=''; ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus();}}">
      <button class="pastebtn" type="button" aria-label="Paste from clipboard" data-paste-target="textarea[name=text]">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M16 2H8a2 2 0 0 0-2 2v2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V6a4 4 0 0 0-4-4Zm-8 4V4h8a2 2 0 0 1 2 2v11h-2V8a2 2 0 0 0-2-2H8Zm6 14H5V10h9v10Zm0-12H8V8h6v0Z"/>
        </svg>
      </button>
      <textarea class="text" name="text" placeholder="Type a message…" maxlength="2000" required rows="2"></textarea>
      <button class="send" type="submit">Send</button>
    </form>
  </main>

  <footer class="foot">
    <a href="/messages" class="muted">Messages partial</a>
  </footer>
</div>

<div class="modal" id="qrModal" hidden aria-hidden="true">
  <div class="modalbackdrop" data-close="1"></div>
  <div class="modalpanel" role="dialog" aria-modal="true" aria-label="QR code">
    <div class="modalhead">
      <div class="modaltitle">Scan</div>
      <button class="iconbtn" type="button" data-close="1" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 1 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4Z"/>
        </svg>
      </button>
    </div>
    <div class="modalbody">
      <img class="qrimg" src="/static/qr.png" alt="QR code" />
    </div>
  </div>
</div>
{{end}}
