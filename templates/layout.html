{{define "layout.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{block "title" .}}App{{end}}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
      (function () {
        const SEARCH_KEY = "chat.search";
        const SHOULD_STICK_KEY = "chat.stickToBottom";

        function escapeHtml(s) {
          return (s || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function isNearBottom(el, thresholdPx) {
          if (!el) return false;
          const threshold = typeof thresholdPx === "number" ? thresholdPx : 80;
          return el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
        }

        function scrollToBottom(el) {
          if (!el) return;
          el.scrollTop = el.scrollHeight;
        }

        function getSearchQuery() {
          const input = document.getElementById("search");
          return input ? (input.value || "").trim() : "";
        }

        function setSearchQuery(v) {
          const input = document.getElementById("search");
          if (!input) return;
          input.value = v || "";
        }

        function applySearch(root) {
          const q = getSearchQuery();
          try {
            localStorage.setItem(SEARCH_KEY, q);
          } catch (_) {}

          const msgs = (root || document).querySelectorAll(".msg");
          const qn = q.toLowerCase();
          msgs.forEach((msg) => {
            const device = (msg.getAttribute("data-device") || "").toLowerCase();
            const textEl = msg.querySelector(".text");
            if (!textEl) return;

            if (!textEl.hasAttribute("data-raw")) {
              textEl.setAttribute("data-raw", textEl.textContent || "");
            }
            if (!textEl.hasAttribute("data-html")) {
              // Preserve original server-rendered HTML (e.g. linkified URLs).
              textEl.setAttribute("data-html", textEl.innerHTML || "");
            }
            const raw = textEl.getAttribute("data-raw") || "";
            const rawLower = raw.toLowerCase();

            const matches = !qn || rawLower.includes(qn) || device.includes(qn);
            msg.classList.toggle("hidden", !matches);

            if (!qn) {
              const html = textEl.getAttribute("data-html");
              if (html != null) textEl.innerHTML = html;
              else textEl.textContent = raw;
              return;
            }

            const escaped = escapeHtml(raw);
            const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
            textEl.innerHTML = escaped.replace(re, (m) => "<mark>" + m + "</mark>");
          });
        }

        async function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
          }
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }

        document.addEventListener("click", async (e) => {
          const btn = e.target && e.target.closest ? e.target.closest(".copybtn") : null;
          if (!btn) return;

          const text = btn.getAttribute("data-copy-text") || "";
          try {
            await copyText(text);
            btn.classList.add("copied");
            window.setTimeout(() => btn.classList.remove("copied"), 900);
          } catch (_) {
            // ignore
          }
        });

        function closeAllMenus(exceptEl) {
          document.querySelectorAll(".msgmenu").forEach((menu) => {
            if (exceptEl && menu === exceptEl) return;
            menu.hidden = true;
            const btn = menu.parentElement ? menu.parentElement.querySelector(".menubtn") : null;
            if (btn) btn.setAttribute("aria-expanded", "false");
          });
        }

        function toggleMenuFor(btn) {
          const wrap = btn.closest(".msgactions");
          const menu = wrap ? wrap.querySelector(".msgmenu") : null;
          if (!menu) return;
          const willShow = !!menu.hidden;
          closeAllMenus(willShow ? menu : null);
          menu.hidden = !willShow;
          btn.setAttribute("aria-expanded", willShow ? "true" : "false");
        }

        async function shareMessage(msgEl) {
          const device = (msgEl.getAttribute("data-device") || "").trim() || "Web";
          const textEl = msgEl.querySelector(".text");
          const tsEl = msgEl.querySelector(".timestamp");
          const raw = (textEl && (textEl.getAttribute("data-raw") || textEl.textContent)) ? (textEl.getAttribute("data-raw") || textEl.textContent) : "";
          const ts = tsEl ? (tsEl.textContent || "").trim() : "";
          const payload = (device ? device + ": " : "") + (raw || "");
          const withTs = ts ? payload + "\n" + ts : payload;

          if (navigator.share) {
            try {
              await navigator.share({ text: withTs });
              return;
            } catch (_) {
              // fall through to copy
            }
          }
          await copyText(withTs);
        }

        async function readClipboardText() {
          if (navigator.clipboard && window.isSecureContext) {
            return await navigator.clipboard.readText();
          }
          return "";
        }

        document.addEventListener("click", async (e) => {
          const menuBtn = e.target && e.target.closest ? e.target.closest(".menubtn") : null;
          if (menuBtn) {
            toggleMenuFor(menuBtn);
            return;
          }

          const item = e.target && e.target.closest ? e.target.closest(".menuitem") : null;
          if (item) {
            const action = item.getAttribute("data-action") || "";
            const msgEl = item.closest(".msg");
            if (action === "toggle-timestamp" && msgEl) {
              const tsEl = msgEl.querySelector(".timestamp");
              if (tsEl) tsEl.hidden = !tsEl.hidden;
            }
            if (action === "share" && msgEl) {
              try { await shareMessage(msgEl); } catch (_) {}
            }
            closeAllMenus();
            return;
          }

          const btn = e.target && e.target.closest ? e.target.closest(".pastebtn") : null;
          if (!btn) return;
          const sel = btn.getAttribute("data-paste-target") || "";
          const target = sel ? document.querySelector(sel) : null;
          if (!target) return;

          try {
            const clip = await readClipboardText();
            if (typeof clip === "string" && clip.length) {
              const before = target.value || "";
              const next = before ? before + (before.endsWith("\n") ? "" : "\n") + clip : clip;
              target.value = next;
              target.dispatchEvent(new Event("input", { bubbles: true }));
            }
            target.focus();
          } catch (_) {
            target.focus();
          }
        });

        document.addEventListener("click", (e) => {
          // Close menus on outside click
          const inside = e.target && e.target.closest ? e.target.closest(".msgactions") : null;
          if (!inside) closeAllMenus();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeAllMenus();
            closeQrModal();
          }
        });

        function openQrModal() {
          const modal = document.getElementById("qrModal");
          if (!modal) return;
          modal.hidden = false;
          modal.setAttribute("aria-hidden", "false");
          try { document.body.classList.add("noscroll"); } catch (_) {}
        }

        function closeQrModal() {
          const modal = document.getElementById("qrModal");
          if (!modal) return;
          modal.hidden = true;
          modal.setAttribute("aria-hidden", "true");
          try { document.body.classList.remove("noscroll"); } catch (_) {}
        }

        function initSearchUI() {
          const input = document.getElementById("search");
          const clearBtn = document.getElementById("clearSearch");
          if (!input) return;

          try {
            const saved = localStorage.getItem(SEARCH_KEY);
            if (saved && !input.value) input.value = saved;
          } catch (_) {}

          const run = () => applySearch(document);
          input.addEventListener("input", run);
          input.addEventListener("search", run);
          if (clearBtn) {
            clearBtn.addEventListener("click", () => {
              setSearchQuery("");
              applySearch(document);
              input.focus();
            });
          }
        }

        function initStickToBottom() {
          const messagesEl = document.getElementById("messages");
          if (!messagesEl) return;
          messagesEl.addEventListener("scroll", () => {
            try {
              localStorage.setItem(SHOULD_STICK_KEY, isNearBottom(messagesEl) ? "1" : "0");
            } catch (_) {}
          }, { passive: true });
        }

        // Remember if user was near bottom before HTMX swaps in updates.
        document.addEventListener("htmx:beforeSwap", (e) => {
          const messagesEl = document.getElementById("messages");
          if (!messagesEl) return;
          if (e.target !== messagesEl) return;
          messagesEl.dataset.wasNearBottom = isNearBottom(messagesEl) ? "1" : "0";
        });

        document.addEventListener("htmx:afterSwap", (e) => {
          applySearch(e.target);

          const messagesEl = document.getElementById("messages");
          if (!messagesEl) return;
          if (e.target !== messagesEl) return;

          const force = !!window.__chatForceScroll;
          window.__chatForceScroll = false;
          const wasNear = (messagesEl.dataset.wasNearBottom || "") === "1";
          let shouldStick = wasNear;
          try {
            const savedStick = localStorage.getItem(SHOULD_STICK_KEY);
            if (savedStick === "1") shouldStick = true;
          } catch (_) {}

          if (force || shouldStick) scrollToBottom(messagesEl);
        });

        document.addEventListener("DOMContentLoaded", () => {
          initSearchUI();
          initStickToBottom();
          applySearch(document);

          const refreshBtn = document.getElementById("refreshChat");
          if (refreshBtn) refreshBtn.addEventListener("click", () => window.location.reload());

          const openBtn = document.getElementById("openQr");
          if (openBtn) openBtn.addEventListener("click", openQrModal);
          document.addEventListener("click", (e) => {
            const modal = document.getElementById("qrModal");
            if (!modal || modal.hidden) return;
            const closeEl = e.target && e.target.closest ? e.target.closest("[data-close='1']") : null;
            if (closeEl) closeQrModal();
          });

          const messagesEl = document.getElementById("messages");
          if (messagesEl) {
            // Always start at latest message on first load.
            scrollToBottom(messagesEl);
          }
        });
      })();
    </script>
  </head>
  <body>
    {{block "body" .}}{{end}}
  </body>
</html>
{{end}}
